name: beliora_1
description: "A self-help and mental wellness tool - Beliora."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Iconos estándar para iOS [cite: 17]
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4

  # Stack Tecnológico de Beliora
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  
  # Autenticación Social (Paso 1 del Login)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Sección específica de configuración de Flutter
flutter:
  # Habilita el diseño Material para Android e iOS
  uses-material-design: true

  # Registro de Assets (Logo y animaciones)
  assets:
    - assets/images/

  # Configuración de Tipografía para la marca
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700